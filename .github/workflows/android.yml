name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate project
        run: gradle --no-daemon tasks

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build minified release APK and AAB (R8)
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DoceDeLeite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload minified release APK
        uses: actions/upload-artifact@v4
        with:
          name: DoceDeLeite-release-apk-R8
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: DoceDeLeite-release-aab-R8
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
